apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-web
  namespace: escape-web
  labels:
    app: escape-web
spec:
  # SQLite(ReadWriteOnce PVC)는 단일 파드만 가능
  # Socket.io도 단일 레플리카에서 정상 동작
  # 수평 확장이 필요하다면 Turso(libsql remote) 또는 PostgreSQL로 DB 전환 필요
  replicas: 1
  selector:
    matchLabels:
      app: escape-web
  strategy:
    type: Recreate   # RWO PVC이므로 RollingUpdate 대신 Recreate 사용
  template:
    metadata:
      labels:
        app: escape-web
    spec:
      containers:
        - name: escape-web
          image: ghcr.io/YOUR_ORG/escape-web:latest  # 실제 이미지 경로로 변경
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: escape-web-secret
            - configMapRef:
                name: escape-web-config
          volumeMounts:
            - name: db-data
              mountPath: /app/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: escape-web-db
