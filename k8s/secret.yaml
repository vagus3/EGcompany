# 실제 배포 전에 값을 채워넣거나 sealed-secrets / external-secrets 등으로 관리하세요.
# base64 인코딩: echo -n "value" | base64
apiVersion: v1
kind: Secret
metadata:
  name: escape-web-secret
  namespace: escape-web
type: Opaque
stringData:
  DATABASE_URL: "file:/app/data/db.sqlite"
  NEXTAUTH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  NEXTAUTH_URL: "https://your-domain.com"
  RESEND_API_KEY: ""
